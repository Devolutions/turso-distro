name: Turso Release
on:
  workflow_dispatch:
    inputs:
      package_revision:
        description: Downstream package revision override (blank = use PACKAGE_REVISION, auto = infer next release revision)
        default: ""
        required: false
      github-env:
        description: GitHub environment selection
        required: true
        type: choice
        options:
          - auto
          - test
          - prod
        default: auto
      skip-publish:
        description: Skip Artifactory and GitHub Release publishing
        required: true
        type: boolean
        default: false
      dry-run:
        description: Dry run (simulate publishing)
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

env:
  ARTIFACTORY_URL: "https://devolutions.jfrog.io/artifactory/"
  ARTIFACTORY_NUGET_REPOSITORY: "nuget"

jobs:
  build:
    name: Build Turso .NET packages
    uses: ./.github/workflows/turso-dotnet.yml
    permissions:
      actions: read
      contents: read
    with:
      package_revision: ${{ inputs.package_revision }}
      github-env: ${{ inputs.github-env }}
      skip-publish: ${{ inputs.skip-publish }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  publish:
    name: Publish Turso release
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ fromJSON(needs.build.outputs.skip-publish) == false }}
    environment: ${{ needs.build.outputs.package-env }}
    permissions:
      actions: read
      contents: write

    steps:
      - name: Clone project with Turso submodule
        uses: actions/checkout@v7.0.0
        with:
          submodules: true
          fetch-depth: 0

      - name: Export downstream Turso patch
        shell: pwsh
        env:
          TURSO_UPSTREAM_TAG: ${{ needs.build.outputs.turso-upstream-tag }}
          TURSO_SOURCE_COMMIT: ${{ needs.build.outputs.turso-source-commit }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($Name in 'TURSO_UPSTREAM_TAG', 'TURSO_SOURCE_COMMIT', 'PACKAGE_VERSION') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($Name))) {
              throw "$Name is empty."
            }
          }

          & git -C turso-src fetch --no-tags origin "+refs/tags/$($Env:TURSO_UPSTREAM_TAG):refs/tags/$($Env:TURSO_UPSTREAM_TAG)"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch $Env:TURSO_UPSTREAM_TAG into turso-src."
          }

          $PatchArgs = @{
            RepoPath = 'turso-src'
            Branch = $Env:TURSO_SOURCE_COMMIT
            BaseTag = $Env:TURSO_UPSTREAM_TAG
            ReleaseVersion = $Env:PACKAGE_VERSION
            OutputDir = (Join-Path $PWD 'release-assets')
          }
          ./scripts/Export-TursoPatch.ps1 @PatchArgs

      - name: Download release-ready NuGet packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.release-package-artifact }}
          path: release-assets

      - name: Install JFrog CLI
        if: ${{ fromJSON(needs.build.outputs.dry-run) == false }}
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/jfrog-cli"
          mkdir -p "$tool_root"
          cd "$tool_root"
          curl -fL https://getcli.jfrog.io/v2 | sh
          echo "$tool_root" >> "$GITHUB_PATH"

      - name: Publish to Artifactory
        shell: pwsh
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $DryRun = [System.Boolean]::Parse('${{ needs.build.outputs.dry-run }}')
          $NugetPackages = @(Get-ChildItem -Path ./release-assets -Filter *.nupkg -File | Sort-Object Name)
          if ($NugetPackages.Count -eq 0) {
            throw "No .nupkg files found in ./release-assets."
          }

          $Leaked = @($NugetPackages | Where-Object { $_.Name -like 'Turso.*' })
          if ($Leaked.Count -gt 0) {
            throw "Refusing to publish upstream package IDs: $($Leaked.Name -join ', ')"
          }

          if (-not $DryRun) {
            if ([string]::IsNullOrWhiteSpace($Env:ARTIFACTORY_USERNAME) -or [string]::IsNullOrWhiteSpace($Env:ARTIFACTORY_PASSWORD)) {
              throw "ARTIFACTORY_USERNAME and ARTIFACTORY_PASSWORD secrets are required to publish."
            }
          }

          foreach ($NugetPackage in $NugetPackages) {
            Write-Host "Publishing $($NugetPackage.Name) to $Env:ARTIFACTORY_URL$Env:ARTIFACTORY_NUGET_REPOSITORY"
            echo "- $($NugetPackage.Name)" >> $Env:GITHUB_STEP_SUMMARY

            if ($DryRun) {
              Write-Host "Dry Run: skipping Artifactory publishing!"
              continue
            }

            $UploadArgs = @(
              'rt', 'upload', $NugetPackage.FullName, "$Env:ARTIFACTORY_NUGET_REPOSITORY/",
              '--flat=true',
              "--url=$Env:ARTIFACTORY_URL",
              "--user=$Env:ARTIFACTORY_USERNAME",
              "--password=$Env:ARTIFACTORY_PASSWORD"
            )
            & jfrog @UploadArgs
            if ($LASTEXITCODE -ne 0) {
              throw "jfrog rt upload failed for $($NugetPackage.Name) with exit code $LASTEXITCODE"
            }
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: release-assets
        run: |
          $ErrorActionPreference = 'Stop'

          $DryRun = [System.Boolean]::Parse('${{ needs.build.outputs.dry-run }}')
          $PackageVersion = '${{ needs.build.outputs.package-version }}'
          $ReleaseTag = '${{ needs.build.outputs.release-tag }}'
          $ReleaseTitle = '${{ needs.build.outputs.release-title }}'
          $Repository = $Env:GITHUB_REPOSITORY
          $SourceCommit = '${{ needs.build.outputs.turso-source-commit }}'

          $NugetPackages = @(Get-ChildItem -Filter *.nupkg -File | Sort-Object Name)
          if ($NugetPackages.Count -eq 0) {
            throw "No .nupkg files found in the release package directory."
          }

          $PatchFiles = @(Get-ChildItem -File | Where-Object { $_.Name -like 'turso-patch-*.patch' } | Sort-Object Name)
          if ($PatchFiles.Count -ne 1) {
            throw "Expected exactly one generated patch file in the release package directory, found $($PatchFiles.Count)."
          }

          $ReleaseAssetFiles = @(@($NugetPackages) + @($PatchFiles) | Sort-Object Name)

          $HashPath = 'checksums'
          $ChecksumLines = foreach ($ReleaseAssetFile in $ReleaseAssetFiles) {
            $Hash = Get-FileHash -Algorithm SHA256 -LiteralPath $ReleaseAssetFile.FullName
            "$($Hash.Hash)  $($ReleaseAssetFile.Name)"
          }
          Set-Content -Path $HashPath -Value $ChecksumLines -Encoding ASCII

          echo "::group::checksums"
          Get-Content $HashPath
          echo "::endgroup::"

          $PackageRows = foreach ($NugetPackage in $NugetPackages) {
            "| ``$($NugetPackage.Name)`` |"
          }

          $NotesPath = 'release-notes.md'
          $ReleaseNotes = @(
            "# $ReleaseTitle",
            "",
            "| Field | Value |",
            "| --- | --- |",
            "| Package version | $PackageVersion |",
            "| Package feed | $Env:ARTIFACTORY_URL$Env:ARTIFACTORY_NUGET_REPOSITORY |",
            "| Turso upstream release | ${{ needs.build.outputs.turso-release-tag }} |",
            "| Turso upstream source ref | ${{ needs.build.outputs.turso-upstream-tag }} |",
            "| Turso downstream source ref | ${{ needs.build.outputs.turso-source-ref }} |",
            "| Turso source commit | $SourceCommit |",
            "| Patch file | $($PatchFiles[0].Name) |",
            "",
            "| Packages |",
            "| --- |"
          ) + $PackageRows
          Set-Content -Path $NotesPath -Value $ReleaseNotes -Encoding utf8

          if ($DryRun) {
            Write-Host "Dry Run: skipping GitHub release!"
          } else {
            $ReleaseAssets = @($ReleaseAssetFiles | ForEach-Object { $_.Name }) + $HashPath
            $PrereleaseArgs = @()
            if ('${{ needs.build.outputs.turso-version }}' -match '-') {
              $PrereleaseArgs += '--prerelease'
            }
            & gh release create $ReleaseTag --repo $Repository --target $Env:GITHUB_SHA --title $ReleaseTitle --notes-file $NotesPath @PrereleaseArgs @ReleaseAssets
            if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed for $ReleaseTag with exit code $LASTEXITCODE"
            }
          }

      - name: Upload dry-run release assets
        if: ${{ fromJSON(needs.build.outputs.dry-run) }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Turso-Release-DryRun-${{ needs.build.outputs.package-version }}
          path: release-assets/**
          if-no-files-found: error
