name: Sync Turso upstream

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TURSO_UPSTREAM_REPOSITORY: https://github.com/tursodatabase/turso.git
  TURSO_UPSTREAM_BRANCH: main
  # Mirror v0.8.0 and later, including prereleases such as v0.9.0-pre.1.
  TURSO_UPSTREAM_TAG_PATTERN: '^v(0\.([8-9]|[1-9][0-9]+)|[1-9][0-9]*\.[0-9]+)\.[0-9]+(-[0-9A-Za-z.]+)?$'

jobs:
  sync:
    name: Sync upstream branch and tags
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Turso upstream remote
        run: |
          git remote add turso "$TURSO_UPSTREAM_REPOSITORY"

      - name: Fetch Turso upstream branches
        run: |
          # --no-tags keeps bare upstream vX.Y.Z tags out of the downstream tag namespace.
          git fetch turso --prune --no-tags

      - name: Configure authenticated origin
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::TURSO_UPSTREAM_SYNC_TOKEN or DEVOLUTIONSBOT_WRITE_TOKEN is required to push upstream Turso refs because they contain workflow files."
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          SYNC_TOKEN: ${{ secrets.TURSO_UPSTREAM_SYNC_TOKEN || secrets.DEVOLUTIONSBOT_WRITE_TOKEN }}

      - name: Update upstream branch
        run: |
          git push origin "refs/remotes/turso/${TURSO_UPSTREAM_BRANCH}:refs/heads/upstream" --force

      - name: Push upstream tags under namespace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          git fetch turso --prune --no-tags "+refs/tags/*:refs/tags/upstream/*"

          tags_to_push=()
          while IFS= read -r tag_ref; do
            tag_name="${tag_ref#refs/tags/upstream/}"
            if ! [[ "$tag_name" =~ $TURSO_UPSTREAM_TAG_PATTERN ]]; then
              continue
            fi
            if git ls-remote --exit-code --tags origin "$tag_ref" > /dev/null; then
              continue
            fi
            tags_to_push+=("$tag_ref:$tag_ref")
          done < <(git for-each-ref --format='%(refname)' refs/tags/upstream)

          if [ ${#tags_to_push[@]} -eq 0 ]; then
            echo "No new upstream tags to push."
            exit 0
          fi

          printf 'Pushing %s\n' "${tags_to_push[@]}"
          git push origin "${tags_to_push[@]}"
